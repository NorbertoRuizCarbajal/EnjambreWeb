<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Panel privado · Enjambre</title>
<link rel="stylesheet" href="../vendor/MarkerCluster.css"><link rel="stylesheet" href="../vendor/MarkerCluster.Default.css">
<style>
:root{--agua:#0a2230;--acero:#22333c;--niebla:#eef2f1;--boya:#f2b705}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--niebla);color:#13232b}
header{background:var(--agua);color:#fff;padding:.6rem 1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}header h1{font-size:1.05rem;margin:0;flex:1}
nav button,.b{font:inherit;min-height:40px;padding:.4rem .9rem;border:1.5px solid #8aa0a8;background:#fff;border-radius:3px;cursor:pointer}
header button{background:transparent;color:#fff;border-color:#8aa0a8}header button[aria-current=true]{background:var(--boya);color:#1a1400;border-color:var(--boya)}
main{padding:1rem;max-width:1200px;margin:0 auto}.b.p{background:var(--boya);border-color:var(--boya);font-weight:600}
input,select,textarea{font:inherit;min-height:40px;padding:.4rem .6rem;border:1.5px solid #8aa0a8;border-radius:3px;background:#fff;max-width:100%}
label{display:grid;gap:.25rem;font-size:.9rem;font-weight:500}.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:end;margin-bottom:1rem}
.card{background:#fff;border:1px solid #c9d6da;border-radius:3px;padding:.8rem 1rem}.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem}.kpi b{display:block;font-size:2rem}
table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid #dbe4e6;font-size:.92rem}tr.c{cursor:pointer}tr.c:hover,tr.c:focus{background:#f3f8f8}
.tag{display:inline-block;padding:0 .5rem;border-radius:10px;background:#dbe9ee;font-size:.8rem}.tl li{margin:.4rem 0}.mu{color:#5a6f77;font-size:.85rem}
dialog{width:min(760px,96vw);max-height:92vh;border:0;border-radius:4px;padding:1rem 1.2rem}dialog::backdrop{background:rgba(10,34,48,.6)}
#mapa-ad{height:68vh;min-height:360px;border-radius:3px}.err{color:#a32}#login{max-width:360px;margin:12vh auto;display:grid;gap:.8rem}
.scroll{overflow-x:auto}@media(max-width:700px){th:nth-child(n+4),td:nth-child(n+4){display:none}}
</style></head>
<body>
<div id="login" class="card" hidden><h1 style="margin:0;font-size:1.3rem">Panel privado de Enjambre</h1>
<label>Correo<input id="lm" type="email" autocomplete="username"></label><label>Contraseña<input id="lp" type="password" autocomplete="current-password"></label>
<button class="b p" id="lg">Iniciar sesión</button><p id="le" class="err" role="alert"></p></div>
<div id="app" hidden>
<header><h1>Enjambre · Panel privado</h1><nav><button data-t="resumen">Resumen</button> <button data-t="contactos">Contactos</button> <button data-t="mapa">Mapa</button> <button id="out">Salir</button></nav></header>
<main id="vista"></main></div>
<dialog id="dlg"></dialog>
<script src="config.js"></script><script src="../vendor/supabase.js"></script><script src="../js/mapa.js"></script>
<script src="admin.js"></script>
</body></html>
